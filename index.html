<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#2</title>
<link rel="stylesheet" href="styles/style.css">
<script src="Utils/trackball-rotator.js"></script>
<script src="Utils/m4.js"></script>
<script src="StereoCamera.js"></script>
<script src="Model.js"></script>
<script src="Texture.js"></script>
<script src="SensorHandler.js"></script>
<script src="shader.gpu"></script>
<script src="main.js"></script>

</head>
<body onload="init()">
    <div class="wrapper">
        <h1 class="title">PA 2 - Tangible interface</h1>
        <p>Anna Tkachuk, TR-42mp</p>

        <div class="surface-content">
            <div id="canvas-holder">
                <canvas width="700" height="500" id="webglcanvas" style="background-color:red"></canvas>
            </div>
            <div class="parameters">
                <div class="parameters-item">
                    <label for="serverIP">Sensor Server IP:</label>
                    <input class="input-text" id="serverIP" name="serverIP" type="text" value="192.168.1.102">
                </div>
                <div class="button-item">
                    <button class="button" id="connectBtn">Connect</button>
                    <p class="button-hint" id="connectionStatus">Disconnected</p>
                </div>
                <div class="parameters-item">
                    <label for="eyeSeparation">Eye separation parameter:</label>
                    <input id="eyeSeparation" name="eyeSeparation" type="range" min="0.1" max="2.0" step="0.1" value="0.7">
                </div>
                <div class="parameters-item">
                    <label for="fieldOfView">Field of View angle:</label>
                    <input id="fieldOfView" name="fieldOfView" type="range" min="0.1" max="1.0" step="0.05" value="0.4">
                </div>
                <div class="parameters-item">
                    <label for="nearClipping">Near Clipping distance:</label>
                    <input id="nearClipping" name="nearClipping" type="range" min="1.0" max="10.0" step="0.5" value="8.0">
                </div>
                <div class="parameters-item">
                    <label for="convergence">Convergence distance:</label>
                    <input id="convergence" name="convergence" type="range" min="5.0" max="20.0" step="0.5" value="14.0">
                </div>
            </div>
        </div>
    </div>
</body></html>
